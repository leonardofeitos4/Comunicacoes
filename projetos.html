<script>

// LIGHTBOX
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

document.querySelectorAll('.proj-item').forEach(item => {
  item.addEventListener('click', () => {
    lightboxImg.src = item.querySelector('img').src;
    lightbox.classList.add('ativo');
  });
});

document.getElementById('lightbox-fechar').addEventListener('click', fechar);
lightbox.addEventListener('click', e => { if(e.target === lightbox) fechar(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') fechar(); });

function fechar() {
  lightbox.classList.remove('ativo');
}


// FILTROS
document.querySelectorAll('.proj-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.proj-btn').forEach(b => b.classList.remove('ativo'));
    btn.classList.add('ativo');

    const secao = btn.dataset.secao;
    document.querySelectorAll('.proj-grid').forEach(g => {
      g.id === secao ? g.classList.remove('escondido') : g.classList.add('escondido');
    });
  });
});

</script>
